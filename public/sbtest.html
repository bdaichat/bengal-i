<!DOCTYPE html><html><body>
<h3>allow-scripts only</h3>
<iframe id="a" sandbox="allow-scripts" style="width:300px;height:120px;border:1px solid red"></iframe>
<h3>allow-scripts allow-same-origin</h3>
<iframe id="b" sandbox="allow-scripts allow-same-origin" style="width:300px;height:120px;border:1px solid green"></iframe>
<script>
const html = `<!DOCTYPE html><html><head>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"><\/script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
</head><body><div id="root">Loading preview...</div>
<script type="text/babel" data-presets="react">
const {useState}=React;
function App(){const[c,setC]=useState(0);return <button onClick={()=>setC(c+1)}>count {c}</button>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
<\/script></body></html>`;
document.getElementById('a').srcdoc=html;
document.getElementById('b').srcdoc=html;
</script>
</body></html>
